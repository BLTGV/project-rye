name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # docker and docker compose are preinstalled on ubuntu-latest runners;
      # scripts/docker-test.sh brings up its own postgres:15 container.
      - name: Run full test suite
        run: ./scripts/test-all.sh
