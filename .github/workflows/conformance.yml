name: Rye Conformance

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rye
        options: >-
          --health-cmd "pg_isready -U postgres -d rye"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rye

    steps:
      - uses: actions/checkout@v4

      - name: Install Rye schema
        run: ./scripts/install.sh --profiles crm,pm

      - name: Run conformance suite
        run: ./scripts/conformance.sh
