services:
  rye-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rye}
      POSTGRES_DB: ${POSTGRES_DB:-rye}
    ports:
      - "${RYE_POSTGRES_PORT:-54329}:5432"
    volumes:
      - rye_pgdata:/var/lib/postgresql/data
      - ./:/workspace:ro
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rye} -d ${POSTGRES_DB:-rye}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rye_pgdata:
